<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ==========================================================
    ======================= PAGE INFORMATION ======================
    =========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Decoding GATE CSE PYQ Player">

    <meta
        name="author"
        content="Decoding GATE CSE">

    <title>Decoding GATE CSE | PYQ Player</title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="pyq-style2.css">

       

</head>

<script src="https://www.youtube.com/iframe_api"></script>
<body>

        <!-- ======================== HEADER START ======================== -->

        <header id="header">

            <div id="logo">

                <h1>Decoding GATE CSE</h1>

            </div>

            <div id="searchContainer">

                
                <input
                 
                    type="text"
                    id="searchBox"
                    placeholder="Search Subject...">

            </div>

        </header>

        <!-- ======================== HEADER END ======================== -->

    
    <!-- ======================== APP START ======================== -->

    <div id="app">

        <!-- ======================== MAIN START ======================== -->

        <main id="mainContainer">

            <!-- ======================== SUBJECT PANEL START ======================== -->

         <aside id="subjectPanel">

    <h2 class="panelTitle">

        Subjects

    </h2>

    <div id="subjectList">

        <!-- JS yaha subject-card banayega -->

    </div>

</aside>
            <!-- ======================== SUBJECT PANEL END ======================== -->



            <!-- ======================== PYQ PANEL START ======================== -->

            <section id="pyqPanel">

                <div id="subjectHeader">

                    <h2 id="currentSubject">

                        Select Subject

                    </h2>

                    <div id="subjectStats">

</div>

                </div>

                <div id="pyqGrid">

                    <!-- JavaScript -->

                </div>

            </section>

            <!-- ======================== PYQ PANEL END ======================== -->

        </main>

        <!-- ======================== MAIN END ======================== -->

                <!-- ======================== STATUS BAR START ======================== -->

        <section id="statusBar">

            <div class="status-left">

                <span id="progressText">

                    Completed : 0 / 0

                </span>

                <div id="progressContainer">

                    <div id="progressBar"></div>

                </div>

            </div>

            <div class="status-right">

                <button id="prevBtn">

                    ◀ Previous

                </button>

                <button id="nextBtn">

                    Next ▶

                </button>

            </div>

        </section>

        <!-- ======================== STATUS BAR END ======================== -->

                <!-- ======================== FOOTER START ======================== -->

        <footer id="footer">

            <a
                href="#"
                class="footer-link"
                id="youtubeLink">

                YouTube

            </a>

            <a
                href="#"
                class="footer-link"
                id="websiteLink">

                Website

            </a>

            <a
                href="#"
                class="footer-link"
                id="telegramLink">

                Telegram

            </a>

        </footer>

        <!-- ======================== FOOTER END ======================== -->

                <!-- ======================== PLAYER MODAL START ======================== -->

        <div id="videoModal">

            <div id="modalContent">

                <button id="closePlayer">

                    ✕

                </button>

                <div id="youtubePlayer">

                    <!-- YouTube IFrame API -->

                </div>

            </div>

        </div>

        <!-- ======================== PLAYER MODAL END ======================== -->

            </div>

    <!-- ======================== APP END ======================== -->

    <script src="pyq-script2.js"></script>

</body>

</html>
