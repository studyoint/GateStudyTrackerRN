<!DOCTYPE html>

<html lang="en">

<head>

    <!-- ==========================================================
    ======================= PAGE INFORMATION ======================
    =========================================================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Decoding GATE CSE PYQ Player">

    <meta
        name="author"
        content="Decoding GATE CSE">

    <title>Decoding GATE CSE | PYQ Player</title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="pyq-style2.css">

       

</head>

<script src="https://www.youtube.com/iframe_api"></script>
<body>

   <!-- ======================== HEADER START ======================== -->

<header id="header">

    <!-- Mobile Hamburger -->
    <button id="menuBtn" aria-label="Open Subjects">
        ☰
    </button>

    <!-- Logo -->
    <div id="logo">

        <h1>Decoding GATE CSE</h1>

    </div>

    <!-- Desktop Search -->
    <div id="searchContainer">

        <input

            type="text"

            id="searchBox"

            placeholder="Search Subject...">

    </div>

</header>

<!-- ======================== HEADER END ======================== -->

    
    <!-- ======================== APP START ======================== -->

    <div id="app">

        <!-- ======================== MAIN START ======================== -->

        <main id="mainContainer">

  <!-- ======================== SUBJECT PANEL START ======================== -->

<div id="drawerOverlay"></div>

<aside id="subjectPanel">

    <h2 class="panelTitle">

        Subjects

        <button id="closeMenuBtn">
            ✕
        </button>

    </h2>

    <div id="subjectList">

        <!-- JS yaha subject-card banayega -->

    </div>

</aside>

<!-- ======================== SUBJECT PANEL END ======================== -->


            <!-- ======================== PYQ PANEL START ======================== -->

            <section id="pyqPanel">

                <div id="subjectHeader">

                    <h2 id="currentSubject">

                        Select Subject

                    </h2>

                    <div id="subjectStats">

</div>

                </div>

                <div id="pyqGrid">

                    <!-- JavaScript -->

                </div>

            </section>

            <!-- ======================== PYQ PANEL END ======================== -->

        </main>

        <!-- ======================== MAIN END ======================== -->

                <!-- ======================== STATUS BAR START ======================== -->

        <section id="statusBar">

            <div class="status-left">

                <span id="progressText">

                    Completed : 0 / 0

                </span>

                <div id="progressContainer">

                    <div id="progressBar"></div>

                </div>

            </div>

            <div class="status-right">

                <button id="prevBtn">

                    ◀ Previous

                </button>

                <button id="nextBtn">

                    Next ▶

                </button>

            </div>

        </section>

        <!-- ======================== STATUS BAR END ======================== -->

                <!-- ======================== FOOTER START ======================== -->

        <footer id="footer">

            <a
                href="#"
                class="footer-link"
                id="youtubeLink">

                YouTube

            </a>

            <a
                href="#"
                class="footer-link"
                id="websiteLink">

                Website

            </a>

            <a
                href="#"
                class="footer-link"
                id="telegramLink">

                Telegram

            </a>

        </footer>

        <!-- ======================== FOOTER END ======================== -->

      <!-- ==========================================================
================ SECTION 21 : PLAYER MODAL ====================
========================================================== -->

<div id="videoModal">

    <div id="modalContent">

        <button id="closePlayer">

            ✕

        </button>

        <div id="youtubePlayer"></div>

        <div id="playerFooter">

            <h3 id="playerSubject">

                Subject

            </h3>

            <div id="playerControls">

                <button id="playerPrev">

                    ⏮ Previous

                </button>

                <div id="playerCounter">

                    1 / 1

                </div>

                <button id="playerNext">

                    Next ⏭

                </button>

            </div>

        </div>

    </div>

</div>

<!-- ==========================================================
================ END SECTION 21 ===============================
========================================================== -->
            </div>

    <!-- ======================== APP END ======================== -->

    <!-- ==========================================================
================ SECTION 22 : QUICK NOTES ======================
========================================================== -->

<button id="notesBtn">

    📝

</button>

<div id="notesPanel">

    <div id="notesHeader">

        <span>Quick Notes</span>

        <button id="closeNotes">

            ✕

        </button>

    </div>

    <textarea
        id="notesBox"
        placeholder="Write your notes here..."></textarea>

</div>

<!-- ==========================================================
================ END SECTION 22 ===============================
========================================================== -->

    <script src="pyq-script2.js"></script>

</body>

</html>
