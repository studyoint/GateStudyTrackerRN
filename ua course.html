<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Learning Platform</title>

<style>
    


/* =========================
   GLOBAL RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    "Segoe UI",
    system-ui,
    sans-serif;
}


body{

    background:#080b14;
    color:#fff;
    min-height:100vh;
    overflow-y:auto;

}



.app-container{

    min-height:100vh;

    display:flex;

    flex-direction:column;

}

/* =========================
HEADER
========================= */

.top-header{

    height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 30px;

    position:relative;

    background:
    linear-gradient(
        135deg,
        rgba(18,24,42,.95),
        rgba(10,15,28,.98)
    );

    backdrop-filter:blur(18px);

    border-bottom:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 8px 30px rgba(0,0,0,.35),
    inset 0 -1px rgba(255,255,255,.05);

    overflow:hidden;

}


/* Top Glow */

.top-header::before{

    content:"";

    position:absolute;

    top:-120px;
    left:-120px;

    width:320px;
    height:320px;

    background:
    radial-gradient(
        circle,
        rgba(0,170,255,.18),
        transparent 70%
    );

    pointer-events:none;

}


/* Right Glow */

.top-header::after{

    content:"";

    position:absolute;

    right:-120px;
    top:-120px;

    width:300px;
    height:300px;

    background:
    radial-gradient(
        circle,
        rgba(120,80,255,.15),
        transparent 70%
    );

    pointer-events:none;

}


/* =========================
BRAND
========================= */

.brand{

    display:flex;
    align-items:center;
    gap:18px;
    z-index:2;

    cursor:pointer;

    transition:.35s;

}

.brand:hover{

    transform:translateY(-2px);

}


/* =========================
LOGO
========================= */

.logo{

    position:relative;

    width:56px;
    height:56px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:28px;
    font-weight:700;

    color:#fff;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed,
        #06b6d4
    );

    background-size:300% 300%;

    border:1px solid rgba(255,255,255,.12);

    box-shadow:
    0 8px 30px rgba(37,99,235,.35),
    inset 0 1px rgba(255,255,255,.18);

    overflow:hidden;

    transition:.35s;

    animation:
    gradientMove 6s linear infinite,
    floatLogo 3s ease-in-out infinite;

}


/* Shine Effect */

.logo::before{

    content:"";

    position:absolute;

    top:-120%;
    left:-40%;

    width:45%;
    height:300%;

    background:
    rgba(255,255,255,.35);

    transform:rotate(25deg);

    transition:.6s;

}

.logo:hover::before{

    left:130%;

}


/* Outer Glow */

.logo::after{

    content:"";

    position:absolute;

    inset:-3px;

    border-radius:20px;

    background:
    linear-gradient(
        135deg,
        rgba(59,130,246,.45),
        rgba(124,58,237,.45)
    );

    filter:blur(12px);

    z-index:-1;

    opacity:.75;

}


/* Hover */

.logo:hover{

    transform:
    translateY(-5px)
    rotate(-6deg)
    scale(1.12);

    box-shadow:
    0 0 25px rgba(59,130,246,.6),
    0 0 50px rgba(124,58,237,.35),
    0 20px 40px rgba(0,0,0,.35);

}


/* Floating Animation */

@keyframes floatLogo{

    0%,100%{

        transform:translateY(0);

    }

    50%{

        transform:translateY(-4px);

    }

}


/* Gradient Animation */

@keyframes gradientMove{

    0%{

        background-position:0% 50%;

    }

    50%{

        background-position:100% 50%;

    }

    100%{

        background-position:0% 50%;

    }

}
/* =========================
TITLE
========================= */

.brand h1{

    font-size:24px;

    font-weight:700;

    color:#fff;

    letter-spacing:.4px;

}

.brand span{

    display:block;

    margin-top:2px;

    color:#8fa1c9;

    font-size:12px;

    letter-spacing:1px;

    text-transform:uppercase;

}


/* =========================
RIGHT SIDE
========================= */

.header-actions{

    display:flex;

    align-items:center;

    gap:18px;

    z-index:2;

}


/* =========================
MENU BUTTON
========================= */

#menuBtn{

    display:none;

    width:42px;
    height:42px;

    border:none;

    border-radius:12px;

    background:#1f2945;

    color:#fff;

    cursor:pointer;

    transition:.3s;

}

#menuBtn:hover{

    background:#30446f;

    transform:scale(1.06);

}


/* =========================
PROFILE
========================= */

.profile{

    width:44px;
    height:44px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:
    linear-gradient(
        135deg,
        #232d4b,
        #182038
    );

    border:1px solid rgba(255,255,255,.08);

    box-shadow:

    inset 0 1px rgba(255,255,255,.08),

    0 6px 20px rgba(0,0,0,.35);

    cursor:pointer;

    transition:.35s;

}

.profile:hover{

    transform:
    translateY(-3px)
    scale(1.08);

    box-shadow:

    0 0 20px rgba(0,170,255,.30),

    0 12px 25px rgba(0,0,0,.40);

}
/* =========================
MAIN LAYOUT
========================= */

.main-layout{

    flex:1;

    display:flex;

    flex-direction:column;

    gap:20px;

    padding:20px;

overflow:visible;

    background:
    linear-gradient(
        180deg,
        #0b1120,
        #111827
    );

}



.course{

    display:flex;

    align-items:center;

    gap:15px;

}

.course-number{

    width:42px;

    height:42px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

    linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    );

    font-weight:bold;

}

.course-title{

    flex:1;

}

.lecture{

    display:flex;

    align-items:center;

    gap:15px;

}

.lecture-number{

    width:42px;

    height:42px;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:

    linear-gradient(
        135deg,
        #00b4ff,
        #2563eb
    );

    font-weight:bold;

}

.lecture-title{

    flex:1;

}
/* =========================
SECTIONS
========================= */

.course-section,
.lecture-section{

    position:relative;

    background:
    rgba(18,24,42,.75);

    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.08);

    border-radius:22px;

    overflow:hidden;

    box-shadow:

    inset 0 1px rgba(255,255,255,.05),

    0 15px 40px rgba(0,0,0,.35);

}

.course-section{

    min-height:240px;

}

.lecture-section{

    flex:1;

}


/* =========================
SCROLLBAR
========================= */

.course-section::-webkit-scrollbar,
.lecture-section::-webkit-scrollbar{

    width:8px;

}

.course-section::-webkit-scrollbar-thumb,
.lecture-section::-webkit-scrollbar-thumb{

    background:
    linear-gradient(
        #3b82f6,
        #6d5dfc
    );

    border-radius:20px;

}
/* =========================
PREMIUM SECTION HEADERS
========================= */

.sidebar-header,
.lecture-header{

    position:sticky;

    top:0;

    z-index:20;

    padding:28px;

    text-align:center;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        rgba(12,18,35,.96),
        rgba(20,28,50,.94)
    );

    backdrop-filter:blur(24px);

    border-bottom:1px solid rgba(255,255,255,.06);

}


/* Animated Top Neon Line */

.sidebar-header::before,
.lecture-header::before{

    content:"";

    position:absolute;

    top:0;
    left:-40%;

    width:40%;
    height:2px;

    background:
    linear-gradient(
        90deg,
        transparent,
        #00d4ff,
        #6d5dfc,
        #ff00ff,
        transparent
    );

    animation:headerLine 5s linear infinite;

}


/* Neon Glow */

.sidebar-header::after,
.lecture-header::after{

    content:"";

    position:absolute;

    inset:0;

    background:

    radial-gradient(

        circle at center,

        rgba(0,180,255,.12),

        transparent 70%

    );

    pointer-events:none;

}


/* Heading */

.sidebar-header h2,
.lecture-header h2{

    position:relative;

    z-index:2;

    font-size:28px;

    font-weight:800;

    letter-spacing:2px;

    text-transform:uppercase;

    background:
    linear-gradient(
        90deg,
        #ffffff,
        #79d7ff,
        #8d7dff,
        #ffffff
    );

    background-size:300%;

    -webkit-background-clip:text;

    -webkit-text-fill-color:transparent;

    animation:textFlow 6s linear infinite;

    text-shadow:

    0 0 15px rgba(0,170,255,.35);

}


/* Subtitle */

.lecture-header p{

    margin-top:8px;

    font-size:13px;

    letter-spacing:2px;

    color:#9db7ff;

    text-transform:uppercase;

}


/* SEARCH */

.search-box{

    margin-top:22px;

}


/* Animations */

@keyframes headerLine{

    from{

        left:-40%;

    }

    to{

        left:120%;

    }

}

@keyframes textFlow{

    0%{

        background-position:0%;

    }

    100%{

        background-position:300%;

    }

}

/* =========================
SEARCH
========================= */

.search-box input{

    width:100%;

    margin-top:18px;

    padding:14px 18px;

    border:none;

    outline:none;

    border-radius:14px;

    color:#fff;

    background:
    rgba(255,255,255,.05);

    border:1px solid rgba(255,255,255,.08);

    transition:.35s;

}

.search-box input::placeholder{

    color:#94a3b8;

}

.search-box input:focus{

    border-color:#3b82f6;

    background:
    rgba(59,130,246,.08);

    box-shadow:

    0 0 18px rgba(59,130,246,.25);

}


/* =========================
LISTS
========================= */

.course-list{

    padding:20px;

    display:grid;

    grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

    gap:18px;

}


/* =========================
CARDS
========================= */

.course,
.lecture{

    position:relative;

    padding:16px 18px;

    margin-bottom:14px;

    border-radius:16px;

    cursor:pointer;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        rgba(32,42,69,.95),
        rgba(24,32,52,.95)
    );

    border:1px solid rgba(255,255,255,.06);

    transition:.35s;

}


/* Left Accent */

.course::before,
.lecture::before{

    content:"";

    position:absolute;

    left:0;

    top:0;

    width:4px;

    height:100%;

    background:#3b82f6;

    opacity:0;

    transition:.35s;

}


/* Hover */

.course:hover,
.lecture:hover{

    transform:
    translateX(8px)
    scale(1.02);

    border-color:#3b82f6;

    box-shadow:

    0 10px 25px rgba(59,130,246,.18);

}

.course:hover::before,
.lecture:hover::before{

    opacity:1;

}


/* =========================
ACTIVE CARD
========================= */

.course.active,
.lecture.active{

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    ) !important;

    color:#fff;

    border-color:

    rgba(255,255,255,.18);

    box-shadow:

    0 0 20px rgba(59,130,246,.45),

    0 15px 35px rgba(0,0,0,.35);

}

.course.active::before,
.lecture.active::before{

    opacity:1;

    background:#fff;

}

/* =========================
PROGRESS
========================= */


.progress-container{

    padding:0 20px 10px;

}



.progress-bar{

    height:7px;

    background:#26304a;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar span{


    display:block;

    height:100%;

    width:0%;

    background:#4f8cff;


}








/* =========================
BUTTONS
========================= */


.controls-panel{


    padding:15px;

    display:flex;

    gap:12px;

    background:#111827;


}



.controls-panel button{


    flex:1;

    padding:12px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#2563eb;

    color:white;

    font-weight:600;


}



.controls-panel button:hover{


    background:#1d4ed8;


}





/* =========================
MOBILE NAV
========================= */


.mobile-nav{

    display:none;

}







/* =========================
SCROLLBAR
========================= */


::-webkit-scrollbar{

    width:7px;

}



::-webkit-scrollbar-thumb{

    background:#394766;

    border-radius:20px;

}





/* =========================
MOBILE RESPONSIVE
========================= */


@media(max-width:900px){


body{

    overflow:auto;

}



.top-header{

    height:60px;

    padding:0 15px;

}



.brand h1{

    font-size:18px;

}



#menuBtn{

    display:block;

    background:none;

    border:none;

    color:white;

    font-size:25px;

}





.main-layout{

    display:flex;

    flex-direction:column;

    gap:15px;

    padding:15px;

    height:auto;

}




.course-section,
.lecture-section{

    position:static;

    width:100%;

    height:auto;

}
}












</style>



</head>


<body>


<div class="app-container">



<!-- ================= HEADER ================= -->


<header class="top-header">


<div class="brand">


<div class="logo">
🚀
</div>


<div>

<h1>
Decoding GATE CSE
</h1>

<span>
Learn • Practice • Master
</span>

</div>


</div>





<div class="header-actions">


<button id="menuBtn">

☰

</button>



<div class="profile">

👨‍💻

</div>


</div>



</header>







<!-- ================= MAIN AREA ================= -->



<!-- ================= MAIN AREA ================= -->

<div class="main-layout">

    <!-- ================= COURSES ================= -->

    <section class="course-section">

        <div class="sidebar-header">

            <h2>Courses</h2>

            <div class="search-box">

                <input
                    type="text"
                    id="courseSearch"
                    placeholder="Search Course...">

            </div>

        </div>

        <div id="courses" class="course-list">

            <!-- Dynamic Courses -->

        </div>

    </section>


    <!-- ================= LECTURES ================= -->

    <section class="lecture-section">

        <div class="lecture-header">

            <h2 id="courseTitle">

                Select Course

            </h2>

            <p id="courseInfo">

                0 Lectures

            </p>

        </div>

        <div class="progress-container">

            <div class="progress-bar">

                <span id="progress"></span>

            </div>

        </div>

        <div id="list" class="lecture-list">

            <!-- Dynamic Lectures -->

        </div>

    </section>

</div>




<!-- MOBILE BOTTOM NAV -->





</div>


<script>

    


/* ===============================
   COURSE DATABASE
================================ */


const courses = [
    "algo",
    "ALGO 2",

    "cd",
    "cd2",

    "cn",
    "CN2",
    "CN3",

    "dbms",
    "DBMS F1",
    "DBMS F2",

    "dl",
    "DL 2",

    "dm",
    "DM 2",
    "DM F1",

    "ds",
    "DS2",
    "d-ds",

    "em",

    "ga",
    "GA 2",

    "os",
    "OS 2",

    "toc",
    "TOC 2"
];


const coursesDiv = document.getElementById("courses");

const list = document.getElementById("list");

const title = document.getElementById("courseTitle");

const courseInfo = document.getElementById("courseInfo");



const progress = document.getElementById("progress");


const menuBtn=document.getElementById("menuBtn");

let currentLectures=[];

let currentIndex=0;






/* ===============================
   LOAD COURSE BUTTONS
================================ */

courses.forEach((course,index)=>{

    let div=document.createElement("div");

    div.className="course";

    div.innerHTML=`

        <span class="course-number">
            ${(index+1).toString().padStart(2,"0")}
        </span>

        <span class="course-title">
            📘 ${course.toUpperCase()}
        </span>

    `;

    div.onclick=()=>{

        document
        .querySelectorAll(".course")
        .forEach(x=>x.classList.remove("active"));

        div.classList.add("active");

        loadCourse(course);

    };

    coursesDiv.appendChild(div);

});






/* ===============================
   LOAD COURSE FILE
================================ */

function loadCourse(file){

fetch(file + ".txt")

.then(res=>{

    if(!res.ok)
        throw Error("Course file not found : " + file + ".txt");

    return res.text();

})

.then(data=>{

    // Course Name (Supports: Course:, COURSE:, Title:)
    let name =
        data.match(/Course\s*:\s*(.*)/i) ||
        data.match(/COURSE\s*:\s*(.*)/i) ||
        data.match(/Title\s*:\s*(.*)/i);

    title.innerText =
        name ? name[1].trim() : file.toUpperCase();

    // Lecture Formats Supported:
    // L1 https://...
    // Lecture 1 : https://...
    // Lecture1 https://...
    let videos = [
        ...data.matchAll(/(?:Lecture|L)\s*(\d+)\s*:?\s*(https?:\/\/\S+\.webm)/gi)
    ];

    currentLectures = [];

    let html = "";

    videos.forEach((v,index)=>{

        currentLectures.push({

            number: v[1],

            url: v[2].trim()

        });

       html += `

<div class="lecture"
     onclick="playLecture(${index})">

    <span class="lecture-number">
        ${String(index+1).padStart(2,"0")}
    </span>

    <span class="lecture-title">
        🎬 Lecture ${String(index+1).padStart(2,"0")}
    </span>

</div>

`;

    });

    if(currentLectures.length===0){

        html = `
        <div class="lecture">
            ❌ No lectures found in ${file}.txt
        </div>
        `;

    }

    list.innerHTML = html;

    if(window.innerWidth<=900){

        courseSidebar.style.display="none";
        lectureSidebar.style.display="block";
        contentArea.style.display="none";

    }

    courseInfo.innerText =
        currentLectures.length + " Lectures";

})

.catch(err=>{

    list.innerHTML = `
    <div class="lecture">
        ❌ ${err.message}
    </div>
    `;

});

}
/* ===============================
   PLAY LECTURE
================================ */

function playLecture(index){

    // Current lecture object
    let lecture = currentLectures[index];

    // ==========================================
    // STEP 1
    // Open Custom Player Page
    // ==========================================

    // Video URL ko safely encode karo
    const videoURL = encodeURIComponent(lecture.url);

    // Player page open karo aur URL pass karo
   window.open("player.html?video=" + videoURL, "_blank", "noopener,noreferrer");

}/* ===============================
 ACTIVE LECTURE
================================ */


function updateActiveLecture(){



document.querySelectorAll(".lecture")

.forEach((el,i)=>{


el.classList.toggle(

"active",

i===currentIndex

);



});



updateProgress();



}






/* ===============================
 PROGRESS
================================ */


function updateProgress(){



if(currentLectures.length===0)

return;



let value=

((currentIndex+1)/currentLectures.length)*100;



progress.style.width=value+"%";



}







/* ===============================
 NEXT PREVIOUS
================================ */


document
.getElementById("nextBtn")
.onclick=function(){



if(currentIndex < currentLectures.length-1)

{


playLecture(currentIndex+1);


}



};





document
.getElementById("previousBtn")
.onclick=function(){



if(currentIndex>0)

{


playLecture(currentIndex-1);


}



};









/* ===============================
 SPEED CONTROL
================================ */


let speed=1;



document
.getElementById("speedBtn")
.onclick=function(){



speed+=0.25;


if(speed>2)

speed=0.5;



player.playbackRate=speed;


this.innerText=speed+"x";



};







/* ===============================
 SEARCH COURSE
================================ */


document
.getElementById("courseSearch")
.addEventListener(

"input",

function(){


let value=this.value.toLowerCase();



document
.querySelectorAll(".course")
.forEach(c=>{


c.style.display=

c.innerText
.toLowerCase()
.includes(value)

?

"block"

:

"none";



});


}

);







/* ===============================
 REMEMBER LAST VIDEO
================================ */


function saveProgress(){


localStorage.setItem(

"lastLecture",

JSON.stringify({

course:title.innerText,

index:currentIndex


})

);


}








/* ===============================
 KEYBOARD SHORTCUTS
================================ */


document.addEventListener(

"keydown",

e=>{


if(e.code==="Space")

{


e.preventDefault();


player.paused

?

player.play()

:

player.pause();



}



if(e.key==="ArrowRight")

{


document.getElementById("nextBtn").click();


}



if(e.key==="ArrowLeft")

{


document.getElementById("previousBtn").click();


}




}

);






menuBtn.onclick=function(){

    courseSidebar.style.display="block";
    lectureSidebar.style.display="none";
    contentArea.style.display="none";

}
/* ===============================
 DEFAULT LOAD
================================ */
document.getElementById("coursesTab").onclick=function(){

courseSidebar.style.display="block";
lectureSidebar.style.display="none";
contentArea.style.display="none";

}

document.getElementById("lecturesTab").onclick=function(){

courseSidebar.style.display="none";
lectureSidebar.style.display="block";
contentArea.style.display="none";

}

document.getElementById("playerTab").onclick=function(){

courseSidebar.style.display="none";
lectureSidebar.style.display="none";
contentArea.style.display="flex";

}

window.onresize=function(){

if(window.innerWidth>900){

courseSidebar.style.display="";
lectureSidebar.style.display="";
contentArea.style.display="flex";

}

}

loadCourse(courses[0]);






</script>
</body>


</html>
