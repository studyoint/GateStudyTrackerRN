<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Learning Platform</title>


<style>
    <style>

/* =========================
   GLOBAL RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:
    "Segoe UI",
    system-ui,
    sans-serif;
}


body{

    background:#080b14;
    color:#fff;
    height:100vh;
    overflow:hidden;

}



.app-container{

    height:100vh;
    display:flex;
    flex-direction:column;

}



/* =========================
HEADER
========================= */


.top-header{

    height:70px;
    background:
    linear-gradient(
        135deg,
        #151b30,
        #0d1220
    );

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    border-bottom:1px solid #26304a;

}



.brand{

    display:flex;
    align-items:center;
    gap:15px;

}


.logo{

    height:45px;
    width:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;

    background:#202a45;

    border-radius:14px;

}


.brand h1{

    font-size:22px;

}


.brand span{

    font-size:12px;
    color:#9aa4c0;

}



.header-actions{

    display:flex;
    gap:15px;
    align-items:center;

}


#menuBtn{

    display:none;

}



.profile{

    width:40px;
    height:40px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#202a45;

    border-radius:50%;

}






/* =========================
MAIN LAYOUT
========================= */


.main-layout{

    flex:1;

    display:grid;

    grid-template-columns:
    260px
    340px
    1fr;

    overflow:hidden;

}




/* =========================
SIDEBARS
========================= */


.course-sidebar,
.lecture-sidebar{

    background:#111827;

    border-right:1px solid #25304a;

    overflow-y:auto;

}




.sidebar-header,
.lecture-header{

    padding:20px;

    position:sticky;
    top:0;

    background:#111827;

    z-index:2;

}



.sidebar-header h2,
.lecture-header h2{

    font-size:18px;

}





.search-box input{


    width:100%;

    margin-top:15px;

    padding:12px;

    border-radius:12px;

    border:none;

    outline:none;

    background:#202a40;

    color:white;


}




/* COURSE LIST */


.course-list,
.lecture-list{

    padding:15px;

}



.course,
.lecture{


    background:#1b2438;

    padding:15px;

    margin-bottom:12px;

    border-radius:14px;

    cursor:pointer;

    transition:.3s;

    border:1px solid transparent;


}



.course:hover,
.lecture:hover{


    transform:translateX(6px);

    background:#263555;

    border-color:#4f8cff;


}




.active{


    background:
    linear-gradient(
        135deg,
        #2563eb,
        #4f46e5
    ) !important;

}





/* =========================
PROGRESS
========================= */


.progress-container{

    padding:0 20px 10px;

}



.progress-bar{

    height:7px;

    background:#26304a;

    border-radius:20px;

    overflow:hidden;

}



.progress-bar span{


    display:block;

    height:100%;

    width:0%;

    background:#4f8cff;


}







/* =========================
VIDEO AREA
========================= */


.content-area{


    background:#05070d;

    display:flex;

    flex-direction:column;

}



.video-container{


    flex:1;

    display:flex;

    align-items:center;

    justify-content:center;


}



#player{


    width:100%;

    height:100%;

    background:black;

    object-fit:contain;


}





.video-details{


    padding:20px;

    background:#101827;

    border-top:1px solid #25304a;


}


.video-details h2{

    font-size:20px;

}




.video-meta{


    display:flex;

    gap:20px;

    margin-top:10px;

    color:#94a3b8;

    font-size:14px;

}






/* =========================
BUTTONS
========================= */


.controls-panel{


    padding:15px;

    display:flex;

    gap:12px;

    background:#111827;


}



.controls-panel button{


    flex:1;

    padding:12px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    background:#2563eb;

    color:white;

    font-weight:600;


}



.controls-panel button:hover{


    background:#1d4ed8;


}





/* =========================
MOBILE NAV
========================= */


.mobile-nav{

    display:none;

}







/* =========================
SCROLLBAR
========================= */


::-webkit-scrollbar{

    width:7px;

}



::-webkit-scrollbar-thumb{

    background:#394766;

    border-radius:20px;

}





/* =========================
MOBILE RESPONSIVE
========================= */


@media(max-width:900px){


body{

    overflow:auto;

}



.top-header{

    height:60px;

    padding:0 15px;

}



.brand h1{

    font-size:18px;

}



#menuBtn{

    display:block;

    background:none;

    border:none;

    color:white;

    font-size:25px;

}





.main-layout{


    display:block;

    height:calc(100vh - 60px);


}




.course-sidebar,
.lecture-sidebar{


    position:absolute;

    top:60px;

    left:0;

    width:100%;

    height:calc(100vh - 120px);

    z-index:10;


}



.lecture-sidebar,
.content-area{


    display:none;

}



.content-area{

    height:100%;

}




.video-container{

    height:70vh;

}



#player{

    height:100%;

}




.mobile-nav{


    display:flex;

    position:fixed;

    bottom:0;

    left:0;

    width:100%;

    height:60px;

    background:#111827;

    border-top:1px solid #25304a;


}



.mobile-nav button{


    flex:1;

    border:none;

    background:none;

    color:white;

    font-size:13px;


}



}




</style>
</style>


</head>


<body>


<div class="app-container">



<!-- ================= HEADER ================= -->


<header class="top-header">


<div class="brand">


<div class="logo">
🚀
</div>


<div>

<h1>
StudyOint
</h1>

<span>
Learn • Practice • Master
</span>

</div>


</div>





<div class="header-actions">


<button id="menuBtn">

☰

</button>



<div class="profile">

👨‍💻

</div>


</div>



</header>







<!-- ================= MAIN AREA ================= -->



<div class="main-layout">





<!-- ================= COURSE SIDEBAR ================= -->



<aside class="course-sidebar">



<div class="sidebar-header">


<h2>
Courses
</h2>



<div class="search-box">


<input 

type="text"

id="courseSearch"

placeholder="Search course...">


</div>



</div>





<div id="courses" class="course-list">


<!-- Dynamic Courses -->


</div>




</aside>







<!-- ================= LECTURE SIDEBAR ================= -->



<aside class="lecture-sidebar">



<div class="lecture-header">


<h2 id="courseTitle">

Select Course

</h2>


<p id="courseInfo">

0 Lectures

</p>



</div>





<div class="progress-container">


<div class="progress-bar">


<span id="progress">

</span>


</div>


</div>






<div id="list" class="lecture-list">


<!-- Dynamic Lectures -->


</div>





</aside>








<!-- ================= VIDEO AREA ================= -->



<section class="content-area">





<div class="video-container">



<video

id="player"

controls

playsinline

preload="metadata">


Your browser does not support video.


</video>



</div>







<div class="video-details">



<h2 id="videoTitle">

Select Lecture

</h2>



<div class="video-meta">


<span>

🎬 Course Player

</span>


<span>

⚡ Learning Mode

</span>


</div>



</div>







<div class="controls-panel">



<button id="previousBtn">

⬅ Previous

</button>



<button id="nextBtn">

Next ➡

</button>



<button id="speedBtn">

1x

</button>



</div>






</section>






</div>







<!-- MOBILE BOTTOM NAV -->


<nav class="mobile-nav">


<button id="coursesTab">
📚
Courses
</button>


<button id="lecturesTab">
🎥
Lectures
</button>


<button id="playerTab">
▶
Player
</button>



</nav>





</div>





<script>


/* ===============================
   COURSE DATABASE
================================ */


const courses = [

    "aptitude gc",
    "toc1",
    "toc2",
    "algorithm",
    "os",
    "dm",
    "cd",
    "em",
    

];



const coursesDiv = document.getElementById("courses");

const list = document.getElementById("list");

const title = document.getElementById("courseTitle");

const courseInfo = document.getElementById("courseInfo");

const player = document.getElementById("player");

const videoTitle = document.getElementById("videoTitle");

const progress = document.getElementById("progress");


const courseSidebar=document.querySelector(".course-sidebar");
const lectureSidebar=document.querySelector(".lecture-sidebar");
const contentArea=document.querySelector(".content-area");
const menuBtn=document.getElementById("menuBtn");

let currentLectures=[];

let currentIndex=0;






/* ===============================
   LOAD COURSE BUTTONS
================================ */


courses.forEach(course=>{


    let div=document.createElement("div");

    div.className="course";

    div.innerHTML=`

    📘 ${course.toUpperCase()}

    `;


    div.onclick=()=>{


        document.querySelectorAll(".course")
        .forEach(x=>x.classList.remove("active"));


        div.classList.add("active");


        loadCourse(course);


    };


    coursesDiv.appendChild(div);



});








/* ===============================
   LOAD COURSE FILE
================================ */


function loadCourse(file){



fetch(file+".txt")


.then(res=>{


    if(!res.ok)

    throw Error("Course file not found");


    return res.text();


})


.then(data=>{



let name=data.match(/COURSE\s*:\s*(.*)/i);



title.innerText =
name ? name[1] : file.toUpperCase();





let videos=[...data.matchAll(

/Lecture\s+(\d+)\s*:\s*(.*\.webm)/gi

)];




currentLectures=[];



let html="";



videos.forEach((v,index)=>{


currentLectures.push({

number:v[1],

url:v[2].trim()

});



html+=`

<div class="lecture"

onclick="playLecture(${index})">


🎬 Lecture ${v[1]}


</div>


`;



});



list.innerHTML=html;

if(window.innerWidth<=900){

    courseSidebar.style.display="none";
    lectureSidebar.style.display="block";
    contentArea.style.display="none";

}



courseInfo.innerText=

currentLectures.length+" Lectures";



})

.catch(err=>{


list.innerHTML=

`

<div class="lecture">

❌ ${err.message}

</div>

`;


});



}








/* ===============================
   PLAY LECTURE
================================ */


function playLecture(index){



currentIndex=index;



let lecture=currentLectures[index];



player.src=lecture.url;


player.play();



videoTitle.innerText=

"Lecture "+lecture.number;



updateActiveLecture();


saveProgress();

if(window.innerWidth<=900){

    courseSidebar.style.display="none";
    lectureSidebar.style.display="none";
    contentArea.style.display="flex";

}

}







/* ===============================
 ACTIVE LECTURE
================================ */


function updateActiveLecture(){



document.querySelectorAll(".lecture")

.forEach((el,i)=>{


el.classList.toggle(

"active",

i===currentIndex

);



});



updateProgress();



}






/* ===============================
 PROGRESS
================================ */


function updateProgress(){



if(currentLectures.length===0)

return;



let value=

((currentIndex+1)/currentLectures.length)*100;



progress.style.width=value+"%";



}







/* ===============================
 NEXT PREVIOUS
================================ */


document
.getElementById("nextBtn")
.onclick=function(){



if(currentIndex < currentLectures.length-1)

{


playLecture(currentIndex+1);


}



};





document
.getElementById("previousBtn")
.onclick=function(){



if(currentIndex>0)

{


playLecture(currentIndex-1);


}



};









/* ===============================
 SPEED CONTROL
================================ */


let speed=1;



document
.getElementById("speedBtn")
.onclick=function(){



speed+=0.25;


if(speed>2)

speed=0.5;



player.playbackRate=speed;


this.innerText=speed+"x";



};







/* ===============================
 SEARCH COURSE
================================ */


document
.getElementById("courseSearch")
.addEventListener(

"input",

function(){


let value=this.value.toLowerCase();



document
.querySelectorAll(".course")
.forEach(c=>{


c.style.display=

c.innerText
.toLowerCase()
.includes(value)

?

"block"

:

"none";



});


}

);







/* ===============================
 REMEMBER LAST VIDEO
================================ */


function saveProgress(){


localStorage.setItem(

"lastLecture",

JSON.stringify({

course:title.innerText,

index:currentIndex


})

);


}








/* ===============================
 KEYBOARD SHORTCUTS
================================ */


document.addEventListener(

"keydown",

e=>{


if(e.code==="Space")

{


e.preventDefault();


player.paused

?

player.play()

:

player.pause();



}



if(e.key==="ArrowRight")

{


document.getElementById("nextBtn").click();


}



if(e.key==="ArrowLeft")

{


document.getElementById("previousBtn").click();


}




}

);






menuBtn.onclick=function(){

    courseSidebar.style.display="block";
    lectureSidebar.style.display="none";
    contentArea.style.display="none";

}
/* ===============================
 DEFAULT LOAD
================================ */
document.getElementById("coursesTab").onclick=function(){

courseSidebar.style.display="block";
lectureSidebar.style.display="none";
contentArea.style.display="none";

}

document.getElementById("lecturesTab").onclick=function(){

courseSidebar.style.display="none";
lectureSidebar.style.display="block";
contentArea.style.display="none";

}

document.getElementById("playerTab").onclick=function(){

courseSidebar.style.display="none";
lectureSidebar.style.display="none";
contentArea.style.display="flex";

}

window.onresize=function(){

if(window.innerWidth>900){

courseSidebar.style.display="";
lectureSidebar.style.display="";
contentArea.style.display="flex";

}

}

loadCourse(courses[0]);





</script>


</body>


</html>
