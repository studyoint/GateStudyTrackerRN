    <script>
      // ==================================================
      // 📁 SECTION 1: DOM Elements
      // ==================================================
      const pdfInput = document.getElementById("pdfInput");
      const processBtn = document.getElementById("processBtn");
      const downloadLink = document.getElementById("downloadLink");
      const previewContainer = document.getElementById("preview");
      const previewBox = document.getElementById("previewBox");
      const previewBtn = document.getElementById("previewBtn");
      const pdfListBox = document.getElementById("pdfListBox");
      const pdfList = document.getElementById("pdfList");
      const addPageNo = document.getElementById("addPageNo");
      const progressBox = document.getElementById("progressBox");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

      const namePopup = document.getElementById("namePopup");
const outputFileName = document.getElementById("outputFileName");
const okPopup = document.getElementById("okPopup");
const cancelPopup = document.getElementById("cancelPopup");

      let currentPDFBytes = null; // 🧠 Store processed PDF to re-render preview
      let isPreviewVisible = false; // 🧠 Track preview state
      let uploadedFiles = []; // 🧠 Store all uploaded files
      let processedPDFMap = new Map(); // 🧠 Stores: file.name → numbered PDF bytes

      let outputName = "";

      // ==================================================

      // ==================================================
      // 📁 SECTION 2: On Process Button Click
      // ==================================================
      processBtn.addEventListener("click", async () => {

    const files = pdfInput.files;
    uploadedFiles = Array.from(files);

    if (!files.length) {
        alert("Please upload at least one PDF!");
        return;
    }

    // Single PDF
    if (uploadedFiles.length === 1) {

        outputName = uploadedFiles[0].name;
        processPDF();

    }

    // Multiple PDFs
    else {

        outputFileName.value = "";
        namePopup.style.display = "flex";
        outputFileName.focus();

    }

});



      async function processPDF() {

        updateProgress(0, "Starting...");

    let finalPdfBytes = await combinePDFs(uploadedFiles);
        updateProgress(40, "Combining PDFs...");

    if (addPageNo.checked) {
        finalPdfBytes = await addPageNumbers(finalPdfBytes);
      updateProgress(80, "Adding Page Numbers...");
    }

    processedPDFMap.set("combined.pdf", finalPdfBytes);

    const blob = new Blob([finalPdfBytes], {
        type: "application/pdf",
    });

    const url = URL.createObjectURL(blob);

    downloadLink.href = url;
    downloadLink.download = outputName;
    downloadLink.textContent = "📥 Download Combined PDF";
    downloadLink.style.display = "inline-block";
        updateProgress(100, "Completed");

setTimeout(() => {

    progressBox.style.display = "none";

}, 700);

    previewBtn.style.display = "inline-block";
      }
      // ==================================================
      // 📁 SECTION 3: Add Page Numbers to PDF
      // ==================================================
      async function combinePDFs(files) {
        const mergedPdf = await PDFLib.PDFDocument.create();

        for (let file of files) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(arrayBuffer);
          const copiedPages = await mergedPdf.copyPages(
            pdf,
            pdf.getPageIndices()
          );

          copiedPages.forEach((page) => {
            mergedPdf.addPage(page);
          });
        }

        return await mergedPdf.save();
      }




      // ==================================================
      // 📁 SECTION 3: Add Page Numbers to PDF
      // ==================================================
      async function addPageNumbers(pdfBytes) {
        const pdfDoc = await PDFLib.PDFDocument.load(pdfBytes);
        const pages = pdfDoc.getPages();
        const font = await pdfDoc.embedFont(PDFLib.StandardFonts.HelveticaBold);

   pages.forEach((page, index) => {

    const fontSize = 12;
    const text = `[${index + 1}/${pages.length}]`;

    page.drawText(text, {

        x: 20,

        y: 20,

        size: fontSize,

        font: font,

        color: PDFLib.rgb(0, 1, 1),

    });

    page.drawText(" Decoding GATE CSE", {

        x: page.getWidth() - 170,

        y: 20,

        size: 10,

        font: font,

        color: PDFLib.rgb(1, 0, 0),

    });

});
        return await pdfDoc.save();
      }
      // ==================================================

      // ==================================================
      // 📁 SECTION 4: Setup Download Link
      // ==================================================
      function prepareDownload(pdfBytes) {
        const blob = new Blob([pdfBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);

        downloadLink.href = url;
        downloadLink.download = "output.pdf";
        downloadLink.style.display = "inline-block";
        downloadLink.textContent = "📥 Download Combined PDF";
      }
      // ==================================================


      function updateProgress(percent, text = "Processing") {

    progressBox.style.display = "block";

    progressBar.style.width = percent + "%";

    progressText.textContent = `${text} ${percent}%`;

}
      // ==================================================
      // 📁 SECTION 5: Show PDF Preview Using pdf.js
      // ==================================================
      async function showPreview(pdfBytes) {
        previewContainer.innerHTML = "";

        const blob = new Blob([pdfBytes], { type: "application/pdf" });
        const url = URL.createObjectURL(blob);

        const loadingTask = pdfjsLib.getDocument(url);
        const pdf = await loadingTask.promise;

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.0 });

          const canvas = document.createElement("canvas");
          const context = canvas.getContext("2d");
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          await page.render({ canvasContext: context, viewport }).promise;
          previewContainer.appendChild(canvas);
        }
      }

      // ==================================================

      // ==================================================
      // 📁 SECTION 6: Show Preview Button Smart Logic
      // ==================================================
      // ==================================================
      // 📁 SECTION 6: Show/Hide Preview Toggle Button Logic
      // ==================================================
      previewBtn.onclick = () => {
        if (isPreviewVisible) {
          // Hide preview
          previewBox.style.display = "none";
          previewBtn.textContent = "👁️ Show Preview";
          isPreviewVisible = false;
          return;
        }

        if (!processedPDFMap.has("combined.pdf")) {
          alert("Please process PDF first.");
          return;
        }

        const combinedBytes = processedPDFMap.get("combined.pdf");
        currentPDFBytes = combinedBytes;
        previewBox.style.display = "block";
        previewBtn.textContent = "🙈 Hide Preview";
        isPreviewVisible = true;
        showPreview(combinedBytes);
      };

      // ==================================================

      // ==================================================
      // 📁 SECTION 7: Render PDF List UI
      // ==================================================
      function renderPDFList(files) {
        pdfList.innerHTML = "";

        files.forEach((file, index) => {
          const li = document.createElement("li");
          li.textContent = `📄 ${file.name}`;
          li.style.cursor = "pointer";
          li.style.margin = "10px 0";
          li.style.padding = "8px 12px";
          li.style.border = "1px solid #00ffff";
          li.style.borderRadius = "10px";
          li.style.boxShadow = "0 0 10px #00ffff55";
          li.addEventListener("click", () => {
            pdfListBox.style.display = "none";
            previewBox.style.display = "block";
            previewBtn.textContent = "🙈 Hide Preview";
            isPreviewVisible = true;
            showPreviewFromFile(file);
          });

          pdfList.appendChild(li);
        });
      }
      // ==================================================

      // ==================================================
      // 📁 SECTION 8: Preview Helper Function for Single File
      // ==================================================
      // ==================================================
      // 📁 SECTION 8: Preview Helper Function for Single File
      // ==================================================
      async function showPreviewFromFile(file) {
        const processedBytes = processedPDFMap.get(file.name);

        if (processedBytes) {
          currentPDFBytes = processedBytes;
          previewBox.style.display = "block"; // ensure it's visible
          showPreview(processedBytes); // ✅ Show numbered version
        } else {
          const arrayBuffer = await file.arrayBuffer();
          const typedArray = new Uint8Array(arrayBuffer);
          currentPDFBytes = typedArray;
          previewBox.style.display = "block"; // ensure it's visible
          showPreview(typedArray); // fallback if missing
        }
      }
      // ==================================================

      // ==================================================

      // ==================================================
      // 📁 SECTION 9: Scroll to Top Button Logic
      // ==================================================
      const scrollTopBtn = document.getElementById("scrollTopBtn");

      window.onscroll = () => {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight;
        const winHeight = window.innerHeight;

        scrollTopBtn.style.display = scrollTop > 200 ? "block" : "none";
        scrollBottomBtn.style.display =
          scrollTop + winHeight < docHeight - 200 ? "block" : "none";
      };

      scrollTopBtn.onclick = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
      // ==================================================

      // ==================================================
      // 📁 SECTION 10: Scroll to Bottom Button Logic
      // ==================================================
      const scrollBottomBtn = document.getElementById("scrollBottomBtn");

      scrollBottomBtn.onclick = () => {
        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth",
        });
      };
      // ==================================================
    </script>
